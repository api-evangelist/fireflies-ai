aid: fireflies-ai
name: Fireflies.ai
description: >-
  Fireflies.ai is an AI meeting assistant that records, transcribes, summarizes,
  searches, and analyzes voice conversations across Zoom, Google Meet, Microsoft
  Teams, Webex, and dialed calls. It offers 95%+ transcription accuracy in 100+
  languages, AI-generated summaries with action items, conversation analytics,
  soundbites, and the AskFred assistant. Developers integrate via a public GraphQL
  API (bearer-token auth, with OAuth 2.0 for apps and the hosted MCP server) that
  exposes transcripts, users, channels, analytics, audio upload, live-meeting bot
  control, webhooks, and a WebSocket Realtime transcription stream.
